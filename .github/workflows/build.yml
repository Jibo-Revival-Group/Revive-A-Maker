name: Build

# Every push builds the Android APK (signed with the 5x1 key) and the iPhone/iPad IPA (unsigned; AltStore and
# SideStore sign it on install). A v* tag also publishes both as a GitHub release, which the Android app's
# updater reads. apps.5x1.com (the 5x1 AltStore source and F-Droid repo) is updated from these files.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd web && npm ci --no-audit --no-fund && npm test && node --check server.js

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the APK
        env:
          RAM_KEYSTORE_B64: ${{ secrets.RAM_KEYSTORE_B64 }}
          RAM_KEYSTORE_PASSWORD: ${{ secrets.RAM_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$RAM_KEYSTORE_B64" ]; then
            echo "$RAM_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ram.jks"
            export RAM_KEYSTORE="$RUNNER_TEMP/ram.jks"
          fi
          VERSION=$(grep -o "toString() : \"[^\"]*\"" NewAndroidAppSource/BeAMaker/app/build.gradle | cut -d'"' -f2)
          cd NewAndroidAppSource/BeAMaker
          chmod +x gradlew
          ./gradlew --no-daemon -q assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Revive-A-Maker-$VERSION.apk"
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$TOOLS/aapt2" dump badging "$GITHUB_WORKSPACE/Revive-A-Maker-$VERSION.apk" | grep -E "^(package|application-label):"
          "$TOOLS/apksigner" verify --print-certs "$GITHUB_WORKSPACE/Revive-A-Maker-$VERSION.apk" | grep -i "SHA-256"
          # The Node server, its modules and the Scratch playground are all inside.
          unzip -l "$GITHUB_WORKSPACE/Revive-A-Maker-$VERSION.apk" | grep -E "assets/nodejs-project/(server.js|node_modules/rom-control/package.json)|assets/assets/web/playground/index.html"
      - uses: actions/upload-artifact@v4
        with:
          name: Revive-A-Maker-Android
          path: Revive-A-Maker-*.apk

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build the IPA
        run: |
          cd "Vicios/Be a Maker IOS/Be a Maker"
          xcodebuild -project "Be a Maker.xcodeproj" -scheme "Be a Maker" -configuration Release -sdk iphoneos \
            -derivedDataPath dd CODE_SIGNING_ALLOWED=NO -quiet build
          APP=$(ls -d dd/Build/Products/Release-iphoneos/*.app)
          plutil -p "$APP/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleDisplayName|CFBundleShortVersionString|NSLocalNetwork'
          VERSION=$(plutil -extract CFBundleShortVersionString raw "$APP/Info.plist")
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry "$GITHUB_WORKSPACE/Revive-A-Maker-$VERSION.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Revive-A-Maker-iOS
          path: Revive-A-Maker-*.ipa

  # Windows (portable .exe), Mac (.app, universal) and Linux (.AppImage): desktop/ runs web/server.js in Electron.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --omit=dev
        working-directory: web
      - run: npm ci --no-audit --no-fund
        working-directory: desktop
      - run: npx electron-builder --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: The packaged app starts its server and shows the pairing page and the Scratch playground
        shell: bash
        working-directory: desktop/dist
        run: |
          case "$RUNNER_OS" in
            Linux) ./*.AppImage --appimage-extract >/dev/null && xvfb-run -a squashfs-root/revive-a-maker-desktop --no-sandbox --check ;;
            Windows) ./win-unpacked/Revive-A-Maker.exe --check | cat ;;
            macOS) ditto -x -k *.zip "$RUNNER_TEMP/app" && "$RUNNER_TEMP/app/Revive-A-Maker.app/Contents/MacOS/Revive-A-Maker" --check ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: Revive-A-Maker-desktop-${{ runner.os }}
          path: |
            desktop/dist/Revive-A-Maker-*.AppImage
            desktop/dist/Revive-A-Maker-*.exe
            desktop/dist/Revive-A-Maker-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, android, ios, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "Revive-A-Maker ${GITHUB_REF_NAME#v}" --generate-notes Revive-A-Maker-*
